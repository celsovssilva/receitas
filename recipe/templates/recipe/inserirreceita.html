{% extends "base.html" %}
{% block title %}Nova receita · Mesa & Memória{% endblock %}
{% block content %}<div class="panel">
    <p class="eyebrow">Seu repertório</p>
    <h1>Compartilhe uma receita</h1>
    <p>Preencha os detalhes abaixo e deixe sua criação registrada.</p>
    <form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button
            class="button button-primary" type="submit">Salvar receita →</button></form>
</div>{% endblock %}
